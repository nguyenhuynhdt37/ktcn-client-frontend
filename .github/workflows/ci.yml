name: Build and deploy branch
'on':
  push:
    branches:
    - dev
    - main
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build branch image
      id: image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          VITE_API_URL=${{ github.ref == 'refs/heads/main' && 'https://api-ktcn.itup.io.vn/api/v1' || 'https://test-api-ktcn.itup.io.vn/api/v1' }}
          NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/main' && 'https://api-ktcn.itup.io.vn' || 'https://test-api-ktcn.itup.io.vn' }}
          NEXT_PUBLIC_SITE_URL=${{ github.ref == 'refs/heads/main' && 'https://ktcn.itup.io.vn' || 'https://test-ktcn.itup.io.vn' }}
        cache-from: |-
            type=gha,scope=branch-build
            type=gha,scope=test
            type=gha,scope=production
        cache-to: type=gha,mode=max,scope=branch-build
  deploy-test:
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: build
    runs-on:
    - self-hosted
    - linux
    - x64
    - ktcn-deploy
    - ktcn-frontend
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://test-ktcn.itup.io.vn/vi
    steps:
    - name: Deploy branch to staging
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REGISTRY_USER: ${{ github.actor }}
        REPOSITORY: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
      run: "set -euo pipefail\numask 077\ntest -n \"$SSH_KEY\" && test -n \"$SSH_KNOWN_HOSTS\"\nmkdir -p \"$RUNNER_TEMP/ktcn-ssh\"\nprintf '%s\\\
        n' \"$SSH_KEY\" > \"$RUNNER_TEMP/ktcn-ssh/key\"\nprintf '%s\\n' \"$SSH_KNOWN_HOSTS\" > \"$RUNNER_TEMP/ktcn-ssh/known_hosts\"\ntrap 'rm\
        \ -f \"$RUNNER_TEMP/ktcn-ssh/key\" \"$RUNNER_TEMP/ktcn-request.json\"' EXIT\npython3 - <<'PAYLOAD' > \"$RUNNER_TEMP/ktcn-request.json\"\
        \nimport json, os\ne=os.environ\nprint(json.dumps({\"action\":\"deploy\",\"component\":\"frontend\",\"branch\":e[\"BRANCH\"],\"commit\"\
        :e[\"COMMIT\"],\n \"image\":\"ghcr.io/\"+e[\"REPOSITORY\"]+\"@\"+e[\"IMAGE_DIGEST\"],\n \"registry_user\":e[\"REGISTRY_USER\"],\"registry_token\"\
        :e[\"REGISTRY_TOKEN\"]}))\nPAYLOAD\nssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \\\n -o HostKeyAlias=100.122.190.92\
        \ -o UserKnownHostsFile=\"$RUNNER_TEMP/ktcn-ssh/known_hosts\" \\\n -i \"$RUNNER_TEMP/ktcn-ssh/key\" admin@127.0.0.1 deploy < \"$RUNNER_TEMP/ktcn-request.json\"\
        \nprintf 'Deployed `%s` commit `%s` \u2192 https://test-ktcn.itup.io.vn/vi\\n' \"$BRANCH\" \"$COMMIT\" >> \"$GITHUB_STEP_SUMMARY\"\n"
  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on:
    - self-hosted
    - linux
    - x64
    - ktcn-deploy
    - ktcn-frontend
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://ktcn.itup.io.vn/vi
    steps:
    - name: Deploy branch to production
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REGISTRY_USER: ${{ github.actor }}
        REPOSITORY: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
      run: "set -euo pipefail\numask 077\ntest -n \"$SSH_KEY\" && test -n \"$SSH_KNOWN_HOSTS\"\nmkdir -p \"$RUNNER_TEMP/ktcn-ssh\"\nprintf '%s\\\
        n' \"$SSH_KEY\" > \"$RUNNER_TEMP/ktcn-ssh/key\"\nprintf '%s\\n' \"$SSH_KNOWN_HOSTS\" > \"$RUNNER_TEMP/ktcn-ssh/known_hosts\"\ntrap 'rm\
        \ -f \"$RUNNER_TEMP/ktcn-ssh/key\" \"$RUNNER_TEMP/ktcn-request.json\"' EXIT\npython3 - <<'PAYLOAD' > \"$RUNNER_TEMP/ktcn-request.json\"\
        \nimport json, os\ne=os.environ\nprint(json.dumps({\"action\":\"deploy\",\"component\":\"frontend\",\"branch\":e[\"BRANCH\"],\"commit\"\
        :e[\"COMMIT\"],\n \"image\":\"ghcr.io/\"+e[\"REPOSITORY\"]+\"@\"+e[\"IMAGE_DIGEST\"],\n \"registry_user\":e[\"REGISTRY_USER\"],\"registry_token\"\
        :e[\"REGISTRY_TOKEN\"]}))\nPAYLOAD\nssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \\\n -o HostKeyAlias=100.122.190.92\
        \ -o UserKnownHostsFile=\"$RUNNER_TEMP/ktcn-ssh/known_hosts\" \\\n -i \"$RUNNER_TEMP/ktcn-ssh/key\" admin@127.0.0.1 deploy < \"$RUNNER_TEMP/ktcn-request.json\"\
        \nprintf 'Deployed `%s` commit `%s` \u2192 https://ktcn.itup.io.vn/vi\\n' \"$BRANCH\" \"$COMMIT\" >> \"$GITHUB_STEP_SUMMARY\"\n"
