name: Build and deploy test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
defaults:
  run:
    shell: bash
concurrency:
  group: test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      staging: ${{ steps.test.outputs.digest }}
      production: ${{ steps.prod.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image
        id: test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-test
          build-args: |
            VITE_API_URL=https://test-api-ktcn.itup.io.vn/api/v1
            NEXT_PUBLIC_API_URL=https://test-api-ktcn.itup.io.vn
            NEXT_PUBLIC_SITE_URL=https://test-ktcn.itup.io.vn
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Build production image from the same commit
        id: prod
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-production
          build-args: |
            VITE_API_URL=https://api-ktcn.itup.io.vn/api/v1
            NEXT_PUBLIC_API_URL=https://api-ktcn.itup.io.vn
            NEXT_PUBLIC_SITE_URL=https://ktcn.itup.io.vn
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
  deploy-test:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    outputs:
      release: ${{ steps.deploy.outputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://test-ktcn.itup.io.vn/vi
    steps:
      - name: Verify deployment configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TS_CLIENT: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          for name in SSH_KEY SSH_KNOWN_HOSTS TS_CLIENT TS_SECRET; do
            test -n "${!name}" || { echo "Missing staging secret: $name"; exit 1; }
          done
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ktcn-ci
          ping: 100.122.190.92
      - name: Deploy immutable test image
        id: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          STAGING_DIGEST: ${{ needs.build.outputs.staging }}
          PRODUCTION_DIGEST: ${{ needs.build.outputs.production }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ktcn_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/ktcn_deploy' EXIT
          python3 - <<'PYTHON' > "$RUNNER_TEMP/deploy.json"
          import json, os
          e = os.environ
          print(json.dumps({"action":"stage", "component":"frontend", "commit":e["COMMIT"],
            "staging":"ghcr.io/"+e["REPOSITORY"]+"@"+e["STAGING_DIGEST"],
            "production":"ghcr.io/"+e["REPOSITORY"]+"@"+e["PRODUCTION_DIGEST"],
            "registry_user":e["REGISTRY_USER"], "registry_token":e["REGISTRY_TOKEN"]}))
          PYTHON
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20             -i ~/.ssh/ktcn_deploy admin@100.122.190.92 deploy             < "$RUNNER_TEMP/deploy.json" | tee "$RUNNER_TEMP/deploy.log"
          release=$(sed -n 's/^RELEASE_ID=//p' "$RUNNER_TEMP/deploy.log")
          echo "release=$release" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/deploy.json"
          {
            echo '### Test deployment'
            echo 'Preview: https://test-ktcn.itup.io.vn/vi'
            grep '^RELEASE_ID=' "$RUNNER_TEMP/deploy.log" || true
            echo 'Once all three components pass, this workflow waits for production approval.'
          } >> "$GITHUB_STEP_SUMMARY"
  verify-approval-policy:
    needs: deploy-test
    if: needs.deploy-test.outputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless production requires approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ needs.deploy-test.outputs.release }}
        run: |
          [[ "$RELEASE" =~ ^[0-9]{14}-[0-9a-f]{12}$ ]] || exit 1
          gh api "repos/$REPOSITORY/environments/production" \
            --jq '.protection_rules[] | select(.type == "required_reviewers") | .reviewers | length' \
            | grep -Eq '^[1-9][0-9]*$'
  deploy-production:
    needs: [deploy-test, verify-approval-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ktcn.itup.io.vn/vi
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ktcn-ci
          ping: 100.122.190.92
      - name: Deploy approved release
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ACTION: promote
          RELEASE: ${{ needs.deploy-test.outputs.release }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ktcn_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/ktcn_deploy "$RUNNER_TEMP/deploy.json"' EXIT
          python3 - <<'PYTHON' > "$RUNNER_TEMP/deploy.json"
          import json, os
          e = os.environ
          print(json.dumps({"action":e["ACTION"], "release":e["RELEASE"],
            "registry_user":e["REGISTRY_USER"],"registry_token":e["REGISTRY_TOKEN"]}))
          PYTHON
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -i ~/.ssh/ktcn_deploy admin@100.122.190.92 deploy < "$RUNNER_TEMP/deploy.json"
          printf 'Production operation succeeded: `%s`\n' "$RELEASE" >> "$GITHUB_STEP_SUMMARY"
