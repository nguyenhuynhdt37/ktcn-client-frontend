# Build this checkout with the existing Dockerfile and test API/site build arguments.
# This project only runs a frontend; the existing test stack owns the data services.
name: ktcn-test-v2
services:
  frontend:
    image: ${TEST_V2_IMAGE:-ktcn-frontend-test-v2:20261117}
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "13003:3000"
    environment:
      FRONTEND_THEME: cet-v2
      API_URL: http://ktcn-test-backend-1:8000
      NEXT_PUBLIC_API_URL: https://test-v2-ktcn.itup.io.vn
      NEXT_PUBLIC_SITE_URL: https://test-v2-ktcn.itup.io.vn
      REVALIDATION_TOKEN: ${REVALIDATION_TOKEN:?Set a separate token for test-v2}
      HOSTNAME: 0.0.0.0
    networks:
      - test-api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/vi').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
networks:
  test-api:
    external: true
    name: ktcn-test_default
